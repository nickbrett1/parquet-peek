version: 2.1
orbs:
  node: circleci/node@5.0.2
jobs:
  build:
    executor: node/default
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: Install Packages
          command: |
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
      - save_cache:
          paths:
            - node_modules
          key: v1-deps-{{ checksum "package.json" }}

      - run:
          name: Build
          command: npm run build
      - run:
          name: Lint (ESLint + SonarJS)
          command: npm run lint
      - run:
          name: Test with Coverage
          command: npx vitest --coverage

  docker-publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to Container Registry
          command: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use || true
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ghcr.io/nickbrett1/parquet-peek:$CIRCLE_SHA1 -t ghcr.io/nickbrett1/parquet-peek:latest --push .
      - run:
          name: Set GHCR Package Visibility (public)
          command: |
            IMAGE="ghcr.io/nickbrett1/parquet-peek"
            PKG_NAME="$(basename "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            echo "Setting GHCR package '$PKG_NAME' visibility to 'public'..."
            if ! curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null; then
              echo "User-scope call failed; retrying with org scope 'nickbrett1'..."
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GHCR_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/nickbrett1/packages/container/$PKG_NAME/visibility" \
                -d '{"visibility":"public"}' >/dev/null
            fi
workflows:
  build-and-test:
    jobs:
      - build:
          context: common

      - docker-publish:
          context: common
          requires:
            - build
          filters:
            branches:
              only: main
